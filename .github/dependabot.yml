version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/demo"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      demo-dependencies:
        applies-to: version-updates
        patterns: ["*"]
    ignore:
      # Dependabot security updates currently open a false-positive run for
      # fast-uri even though demo/package-lock.json is already on 3.1.2.
      - dependency-name: "fast-uri"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
